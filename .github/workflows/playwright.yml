name: Playwright Tests on Comment
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  playwright:
    name: Run Playwright Tests
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/run-test') || contains(github.event.comment.body, '/run-tests'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright

    steps:
      - name: Get PR Branch Reference
        id: pr_branch
        uses: xt0rted/pull-request-comment-branch@v3

      - name: Checkout PR Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_branch.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        continue-on-error: true
        run: npx playwright test --project=chromium

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: playwright-report
          path: Playwright/playwright-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Playwright/playwright-report

      - name: Post report link to PR
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            const pagesUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Playwright report',
              '',
              `- GitHub Pages report: ${pagesUrl}`,
              `- Workflow run: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });