name: Playwright Tests on Comment
on:
  issue_comment:
    types: [created]

jobs:
  playwright:
    name: Run Playwright Tests
    # Only run if the comment is on a Pull Request and contains the trigger phrase
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/run-tests')
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the actual branch name and SHA of the PR
      - name: Get PR Branch Reference
        id: pr_branch
        uses: xt0rted/pull-request-comment-branch@v3

      # Step 2: Checkout the code using the retrieved PR branch reference
      - name: Checkout PR Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_branch.outputs.head_ref }}

      # Step 3: Initialize Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Step 4: Install your project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Install Playwright browsers along with OS-level dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Step 6: Run your Playwright end-to-end tests
      - name: Run Playwright tests
        run: npx playwright test

      # Step 7: Upload test execution reports if any tests fail
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30