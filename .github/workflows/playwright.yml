name: Playwright Tests on Comment
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  playwright:
    name: Run Playwright Tests
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/run-test') || contains(github.event.comment.body, '/run-tests'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright

    steps:
      - name: Get PR Branch Reference
        id: pr_branch
        uses: xt0rted/pull-request-comment-branch@v3

      - name: Checkout PR Branch Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_branch.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npx playwright test --project=chromium --reporter=github,html,json 2>&1 | tee test-results/test-output.log
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: playwright-report
          path: |
            Playwright/playwright-report/
            Playwright/test-results/results.json
            Playwright/test-results/test-output.log
          retention-days: 30

      - name: Build PR report comment
        id: pr_comment
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v6
        env:
          TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'Playwright', 'test-results', 'results.json');
            const logPath = path.join(process.env.GITHUB_WORKSPACE, 'Playwright', 'test-results', 'test-output.log');
            const exitCode = process.env.TEST_EXIT_CODE || '1';
            const pagesUrl = `https://${process.env.OWNER}.github.io/${process.env.REPO}/`;

            const failures = [];

            function walkSuite(suite, parents = []) {
              const suiteTitle = suite.title ? [...parents, suite.title] : parents;

              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if (test.status === 'failed') {
                    const firstResult = (test.results || []).find(r => r.status === 'failed') || (test.results || [])[0] || {};
                    const message = (firstResult.error && firstResult.error.message) ? String(firstResult.error.message).split('\n')[0] : 'No error message captured';
                    failures.push({
                      title: [...suiteTitle, spec.title].filter(Boolean).join(' > '),
                      project: test.projectName || 'unknown',
                      message,
                    });
                  }
                }
              }

              for (const child of suite.suites || []) {
                walkSuite(child, suiteTitle);
              }
            }

            let body;
            if (!fs.existsSync(reportPath)) {
              let fallback = [];
              if (fs.existsSync(logPath)) {
                const lines = fs.readFileSync(logPath, 'utf8').split('\n');
                const errorLines = lines.filter(l => /^\s*Error:|\bfailed\b/i.test(l)).slice(0, 20);
                fallback = errorLines.map((l, i) => `${i + 1}. ${l.trim()}`);
              }

              body = [
                '### Playwright run from `/run-test`',
                '',
                'Could not find `test-results/results.json`, so failure details were not parsed.',
                fallback.length ? '' : 'No fallback failure lines found in test log.',
                ...fallback,
                '',
                `- Report: ${pagesUrl}`,
                `- Exit code: ${exitCode}`,
              ].join('\n');
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              for (const suite of report.suites || []) {
                walkSuite(suite, []);
              }

              if (failures.length === 0) {
                body = [
                  '### Playwright run from `/run-test`',
                  '',
                  'All tests passed.',
                  '',
                  `- Report: ${pagesUrl}`,
                ].join('\n');
              } else {
                const maxItems = 20;
                const shown = failures.slice(0, maxItems).map((f, i) => `${i + 1}. [${f.project}] ${f.title}\\n   - ${f.message}`);
                const more = failures.length > maxItems ? `\\n...and ${failures.length - maxItems} more failure(s).` : '';
                body = [
                  '### Playwright run from `/run-test`',
                  '',
                  `Failed tests: **${failures.length}**`,
                  '',
                  ...shown,
                  more,
                  '',
                  `- Full HTML report: ${pagesUrl}`,
                ].join('\n');
              }
            }

            core.setOutput('body', body);

      - name: Create or update PR report comment
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v6
        env:
          COMMENT_BODY: ${{ steps.pr_comment.outputs.body }}
        with:
          script: |
            const marker = '<!-- playwright-report -->';
            const issue_number = context.issue.number;
            const body = `${marker}\n${process.env.COMMENT_BODY || 'Playwright run completed.'}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Deploy report to GitHub Pages
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Playwright/playwright-report

      - name: Fail job if tests failed
        if: ${{ steps.run_tests.outputs.exit_code != '0' }}
        run: |
          echo "Playwright tests failed with exit code ${{ steps.run_tests.outputs.exit_code }}"
          exit 1